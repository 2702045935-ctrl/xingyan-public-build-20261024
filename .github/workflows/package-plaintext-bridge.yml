name: package-plaintext-bridge

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Encrypted IPA release tag"
        required: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p bridge
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir bridge \
            --pattern 'Luchat.ipa.enc*'

      - name: Verify and decrypt
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          set -euo pipefail
          cd bridge
          sha256sum -c Luchat.ipa.enc.sha256
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in Luchat.ipa.enc \
            -out Luchat.ipa \
            -pass pass:"$IPA_PASSWORD"
          test "$(head -c 2 Luchat.ipa)" = "PK"
          sha256sum Luchat.ipa

      - name: Upload authenticated artifact
        uses: actions/upload-artifact@v4
        with:
          name: decrypted-ipa-${{ inputs.tag }}
          path: bridge/Luchat.ipa
          if-no-files-found: error
          retention-days: 1
