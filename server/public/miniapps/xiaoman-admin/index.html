<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070706">
  <title>小满火锅 · 运营台</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d5b06f;
      --gold2: #f1d8a4;
      --ink: #f7f2e8;
      --muted: #a69f91;
      --line: rgba(213,176,111,.18);
      --panel: rgba(19,18,16,.88);
      --panel2: rgba(29,27,23,.94);
      --danger: #f16c65;
      --ok: #6fd49b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #070706; }
    body {
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 85% -8%, rgba(213,176,111,.2), transparent 34%),
        radial-gradient(circle at -12% 42%, rgba(125,73,36,.18), transparent 36%),
        linear-gradient(155deg, #11100e 0%, #070706 46%, #0d0b09 100%);
    }
    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      pointer-events: none;
    }
    .shell { width: min(100%, 860px); margin: 0 auto; padding: 14px 16px calc(30px + var(--chris-safe-bottom, 0px)); }
    .topline {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding-right: 78px;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #171208;
      font-weight: 900;
      font-size: 17px;
      background: linear-gradient(145deg, #f7e2b8, #bc8e43);
      box-shadow: 0 8px 28px rgba(213,176,111,.2), inset 0 1px 0 rgba(255,255,255,.66);
      overflow: hidden;
      flex: 0 0 auto;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    .brand-copy { min-width: 0; }
    .brand-copy b { display: block; font-size: 15px; letter-spacing: .4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: 1.6px; }
    .hero {
      position: relative;
      min-height: 208px;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(240,216,169,.16);
      background:
        linear-gradient(0deg, rgba(6,6,5,.92) 0%, rgba(7,7,6,.2) 65%),
        linear-gradient(135deg, #2d2419, #0f0e0c);
      isolation: isolate;
      box-shadow: 0 22px 70px rgba(0,0,0,.32);
    }
    .hero > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,.02) 15%, rgba(5,5,4,.3) 52%, rgba(5,5,4,.94) 100%);
    }
    .hero-copy { position: absolute; left: 20px; right: 20px; bottom: 18px; }
    .eyebrow { color: var(--gold2); font-size: 10px; letter-spacing: 2.4px; font-weight: 700; }
    .hero h1 { margin: 8px 0 6px; font-family: "Songti SC", "STSong", serif; font-size: clamp(28px, 7vw, 38px); line-height: 1.05; letter-spacing: 1px; }
    .hero p { margin: 0; color: rgba(255,255,255,.72); font-size: 12.5px; line-height: 1.55; max-width: 88%; }
    .live {
      position: absolute;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(10,10,9,.62);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px);
      font-size: 11px;
    }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px var(--ok); }
    .live.off i { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin: 14px 0;
      padding: 5px;
      border-radius: 16px;
      background: rgba(12,12,11,.78);
      border: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(20px) saturate(130%);
    }
    .tab {
      min-width: 0;
      height: 39px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #8f897e;
      font-size: 12px;
      font-weight: 600;
    }
    .tab.on {
      color: #171208;
      background: linear-gradient(145deg, #f1d9a8, #c69a54);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 7px 20px rgba(0,0,0,.24);
    }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .stat {
      padding: 15px 16px;
      border-radius: 17px;
      min-height: 91px;
      background: linear-gradient(150deg, rgba(38,34,28,.92), rgba(19,18,16,.94));
      border: 1px solid var(--line);
    }
    .stat span { display: block; color: var(--muted); font-size: 11px; }
    .stat b { display: block; margin-top: 8px; font-size: 25px; font-weight: 700; letter-spacing: -.5px; }
    .section { margin-top: 12px; padding: 17px; border-radius: 20px; background: var(--panel); border: 1px solid rgba(255,255,255,.07); }
    .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-head h2 { margin: 0; font-family: "Songti SC", "STSong", serif; font-size: 19px; letter-spacing: .5px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .section-head .sp { flex: 1; }
    .btn {
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(213,176,111,.25);
      padding: 0 14px;
      background: rgba(213,176,111,.08);
      color: var(--gold2);
      font-size: 12.5px;
      font-weight: 650;
    }
    .btn.primary {
      color: #171208;
      border: 0;
      background: linear-gradient(145deg, #f2dcae, #c0924d);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }
    .btn.danger { color: #ffaaa4; border-color: rgba(241,108,101,.25); background: rgba(241,108,101,.08); }
    .btn.small { height: 31px; padding: 0 10px; border-radius: 9px; font-size: 11.5px; }
    .btn:disabled { opacity: .45; }
    .field { margin-top: 12px; }
    .field:first-child { margin-top: 0; }
    .field label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; color: #b8b0a2; font-size: 11.5px; }
    .field .hint { color: #716c63; font-size: 10px; font-weight: 400; }
    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      outline: 0;
      background: #11110f;
      color: var(--ink);
      padding: 11px 12px;
      font-size: 13px;
    }
    textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
    input:focus, textarea:focus, select:focus { border-color: rgba(213,176,111,.56); box-shadow: 0 0 0 3px rgba(213,176,111,.08); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .switches { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .switch {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-radius: 13px;
      background: #11110f;
      border: 1px solid rgba(255,255,255,.07);
      color: #cec6b8;
      font-size: 12px;
    }
    .switch input { width: 17px; height: 17px; accent-color: var(--gold); padding: 0; }
    .image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .image-card {
      position: relative;
      min-height: 118px;
      overflow: hidden;
      border-radius: 15px;
      background: linear-gradient(145deg, #262117, #11100e);
      border: 1px solid rgba(255,255,255,.08);
    }
    .image-card img { width: 100%; height: 118px; object-fit: cover; display: block; }
    .image-card .empty { min-height: 118px; display: grid; place-items: center; color: #6f695f; font-size: 24px; }
    .image-card .bar {
      position: absolute;
      inset: auto 0 0;
      padding: 18px 9px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,.86));
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 7px;
    }
    .image-card .bar b { font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px #000; }
    .image-card .bar button { height: 27px; padding: 0 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.4); color: white; font-size: 10.5px; backdrop-filter: blur(8px); }
    .chips { display: flex; gap: 7px; overflow-x: auto; padding: 1px 0 6px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      height: 31px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.09);
      background: #11110f;
      color: #aaa397;
      padding: 0 12px;
      font-size: 11.5px;
    }
    .chip.on { color: #19140b; border-color: transparent; background: linear-gradient(145deg, #f1d9a8, #c4954e); font-weight: 700; }
    .dish-list, .order-list, .coupon-list, .category-list { display: grid; gap: 10px; }
    .dish {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 12px;
      min-height: 91px;
      padding: 10px;
      border-radius: 16px;
      background: var(--panel2);
      border: 1px solid rgba(255,255,255,.07);
    }
    .dish .thumb, .order .thumb {
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(145deg, #342a1e, #15120e);
      display: grid;
      place-items: center;
      color: var(--gold);
      font-family: "Songti SC", serif;
      font-size: 25px;
    }
    .dish .thumb img, .order .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .dish .main { min-width: 0; display: flex; flex-direction: column; }
    .dish h3 { margin: 0; font-size: 13.5px; line-height: 1.38; }
    .dish p { margin: 5px 0 0; color: #8e887d; font-size: 10.5px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .dish .meta { margin-top: auto; padding-top: 6px; display: flex; align-items: end; gap: 7px; }
    .price { color: var(--gold2); font-size: 15px; font-weight: 750; }
    .orig { color: #716a5f; font-size: 10px; text-decoration: line-through; }
    .status { margin-left: auto; color: #8e887d; font-size: 10px; }
    .status.off { color: #d87870; }
    .order { padding: 14px; border-radius: 16px; background: var(--panel2); border: 1px solid rgba(255,255,255,.07); }
    .order-head { display: flex; align-items: center; gap: 9px; }
    .order-head b { font-size: 13px; }
    .order-head time { margin-left: auto; color: #777166; font-size: 10px; }
    .order-items { margin: 10px 0; color: #b7afa1; font-size: 11.5px; line-height: 1.7; }
    .order-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .coupon { padding: 14px; border-radius: 15px; border: 1px solid rgba(213,176,111,.15); background: linear-gradient(135deg, rgba(213,176,111,.11), rgba(30,26,20,.96)); }
    .coupon b { font-size: 13px; }
    .coupon span { color: var(--muted); font-size: 11px; }
    .coupon .amount { float: right; color: var(--gold2); font-size: 20px; font-weight: 750; }
    .member {
      position: relative;
      min-height: 168px;
      overflow: hidden;
      padding: 18px;
      border-radius: 21px;
      background:
        radial-gradient(circle at 80% 0, rgba(213,176,111,.3), transparent 42%),
        linear-gradient(135deg, #292218, #0a0908 70%);
      border: 1px solid rgba(240,216,169,.25);
    }
    .member > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .62; }
    .member::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,7,6,.9), rgba(7,7,6,.08)); }
    .member > div { position: relative; z-index: 1; }
    .member .name { font-family: "Songti SC", serif; font-size: 27px; color: #f2dbab; }
    .member .sub { margin-top: 5px; color: #b9a98d; font-size: 11.5px; }
    .member .points { position: absolute; right: 18px; bottom: 18px; text-align: right; }
    .member .points b { display: block; font-size: 25px; color: white; }
    .member .points span { color: var(--muted); font-size: 10px; }
    .footer-note { margin: 18px 4px 2px; color: #676157; font-size: 10px; line-height: 1.6; text-align: center; }
    .empty-panel { padding: 34px 16px; border-radius: 17px; border: 1px dashed rgba(255,255,255,.1); text-align: center; color: #7e786d; font-size: 12px; line-height: 1.7; }
    .loading { min-height: 68vh; display: grid; place-items: center; text-align: center; color: #8d8578; font-size: 12px; }
    .loading .ring { width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%; border: 2px solid rgba(213,176,111,.15); border-top-color: var(--gold); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: calc(24px + var(--chris-safe-bottom, 0px));
      transform: translate(-50%, 18px);
      opacity: 0;
      max-width: min(82vw, 360px);
      padding: 10px 15px;
      border-radius: 12px;
      background: rgba(245,235,216,.96);
      color: #171208;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      transition: .2s ease;
      box-shadow: 0 12px 40px rgba(0,0,0,.32);
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    .modal-mask {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 12px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(12px);
    }
    .modal-mask.on { display: flex; }
    .modal {
      width: min(100%, 700px);
      max-height: min(86vh, 860px);
      overflow: auto;
      border-radius: 24px;
      padding: 17px;
      background: #14130f;
      border: 1px solid rgba(213,176,111,.2);
      box-shadow: 0 30px 100px rgba(0,0,0,.6);
    }
    .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; font-family: "Songti SC", serif; font-size: 20px; }
    .modal-close { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; border: 1px solid rgba(255,255,255,.09); background: #1e1d18; color: #aaa397; font-size: 18px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions .btn { flex: 1; }
    .category-row { display: grid; grid-template-columns: 1fr 65px auto; gap: 7px; margin-top: 8px; }
    .category-row input { padding: 9px 10px; }
    @media (min-width: 700px) {
      .shell { padding-left: 24px; padding-right: 24px; }
      .stats { grid-template-columns: repeat(4, 1fr); }
      .image-grid { grid-template-columns: repeat(4, 1fr); }
      .dish-list { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="shell" id="shell">
    <div class="loading"><div><div class="ring"></div><div id="bootText">正在连接门店后台…</div></div></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-mask" id="modalMask"><div class="modal" id="modal"></div></div>
  <script>
    (function () {
      "use strict";
      var data = null;
      var tab = "home";
      var toastTimer = 0;
      var shell = document.getElementById("shell");
      var toastEl = document.getElementById("toast");
      var modalMask = document.getElementById("modalMask");
      var modal = document.getElementById("modal");

      function esc(v) {
        return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function money(v) {
        var n = Number(v);
        return "¥" + (Number.isFinite(n) ? n.toFixed(2) : "0.00");
      }
      function toast(message) {
        clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.classList.add("on");
        try { if (window.wx && wx.vibrateShort) wx.vibrateShort(); } catch (e) { }
        toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 1900);
      }
      function request(path, method, body) {
        return new Promise(function (resolve, reject) {
          var opts = { url: "/api" + path, method: method || "GET", data: body || null };
          function finish(status, payload) {
            var json = payload || {};
            if (status >= 400 || json.ok === false) {
              reject(new Error(json.error || json.message || ("请求失败 " + status)));
              return;
            }
            resolve(json.data == null ? json : json.data);
          }
          if (window.wx && wx.request && wx.__chris) {
            wx.request({
              url: opts.url,
              method: opts.method,
              data: opts.data,
              success: function (r) { finish(Number(r.statusCode) || 200, r.data); },
              fail: function (e) { reject(new Error((e && e.errMsg) || "网络连接失败")); }
            });
            return;
          }
          fetch(opts.url, {
            method: opts.method,
            credentials: "same-origin",
            headers: opts.data ? { "Content-Type": "application/json" } : {},
            body: opts.data ? JSON.stringify(opts.data) : undefined
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { finish(r.status, j); });
          }).catch(reject);
        });
      }
      function imageMarkup(url, fallback) {
        if (/^(\/|https?:|data:)/.test(String(url || ""))) {
          return '<img src="' + esc(url) + '" alt="">';
        }
        return '<div class="' + (fallback || "empty") + '">' + (fallback === "thumb" ? "满" : "＋") + '</div>';
      }
      function sectionsHead(title, sub, action) {
        return '<div class="section-head"><div><h2>' + esc(title) + '</h2><p>' + esc(sub || "") + '</p></div><div class="sp"></div>' + (action || "") + '</div>';
      }
      function currentShop() { return (data && data.shop) || {}; }
      function shopImageField(key, label, hint) {
        var url = currentShop()[key] || "";
        return '<div class="field"><label>' + esc(label) + '<span class="hint">' + esc(hint || "") + '</span></label>' +
          '<input data-shop="' + key + '" value="' + esc(url) + '" placeholder="/uploads/图片.jpg 或图片网址">' +
          '<div class="image-card" style="margin-top:8px">' +
            '<div data-preview-wrap="' + key + '">' + imageMarkup(url) + '</div>' +
            '<div class="bar"><b>' + (url ? "已设置" : "未设置") + '</b><div>' +
              '<button type="button" data-upload="' + key + '">上传图片</button> ' +
              '<button type="button" data-clear-image="' + key + '">清除</button>' +
            '</div></div>' +
          '</div></div>';
      }
      function inputField(key, label, value, hint, type) {
        return '<div class="field"><label>' + esc(label) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>' +
          '<input data-shop="' + key + '" type="' + (type || "text") + '" value="' + esc(value == null ? "" : value) + '"></div>';
      }
      function textAreaField(key, label, value, hint) {
        return '<div class="field"><label>' + esc(label) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>' +
          '<textarea data-shop="' + key + '">' + esc(value == null ? "" : value) + '</textarea></div>';
      }
      function footer() {
        return '<div class="footer-note">修改后点对应页面的保存按钮，App 下次打开会读取最新内容。<br>图片支持 JPG / PNG / WebP，上传成功后再保存。</div>';
      }

      function homeView() {
        var s = currentShop();
        var st = data.stats || {};
        return '<div class="hero">' + (s.homeCover ? '<img src="' + esc(s.homeCover) + '" alt="">' : "") +
            '<div class="live ' + (s.open === false ? "off" : "") + '"><i></i>' + (s.open === false ? "暂停营业" : "营业中") + '</div>' +
            '<div class="hero-copy"><div class="eyebrow">' + esc(s.homeKicker || "XIAOMAN · HOT POT") + '</div>' +
            '<h1>' + esc(s.homeTitle || s.name || "小满火锅") + '</h1>' +
            '<p>' + esc(s.homeSubtitle || s.announcement || "鲜切牛肉 · 热气腾腾的每一餐") + '</p></div></div>' +
          '<div class="stats">' +
            '<div class="stat"><span>今日订单</span><b>' + Number(st.todayOrders || 0) + '</b></div>' +

      async function uploadImage(key) {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = async function () {
          var file = input.files && input.files[0];
          if (!file) return;
          if (!/^image\//.test(file.type || "")) return toast("请选择图片文件");
          if (file.size > 16 * 1024 * 1024) return toast("图片不能超过 16MB");
          toast("图片上传中…");
          try {
            var dataUrl = await new Promise(function (resolve, reject) {
              var reader = new FileReader();
              reader.onload = function () { resolve(String(reader.result || "")); };
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            var result = await request("/upload", "POST", { filename: file.name, dataUrl: dataUrl });
            if (!result.url) throw new Error("服务器没有返回图片地址");
            var inputs = document.querySelectorAll('[data-shop="' + key + '"], [data-image-field="' + key + '"]');
            inputs.forEach(function (el) { el.value = result.url; });
            document.querySelectorAll('[data-preview-wrap="' + key + '"]').forEach(function (el) {
              el.innerHTML = imageMarkup(result.url);
            });
            toast("图片已上传，记得保存");
          } catch (e) { toast(e.message || "上传失败"); }
        };
        input.click();
      }

        });
        shell.querySelectorAll("[data-shop-bool]").forEach(function (el) {
          out[el.getAttribute("data-shop-bool")] = !!el.checked;
        });
        return out;
      }

      shell.addEventListener("click", async function (event) {
        var go = event.target.closest("[data-go]");
        if (go) { tab = go.getAttribute("data-go"); render(); return; }
        var upload = event.target.closest("[data-upload]");
        if (upload) { uploadImage(upload.getAttribute("data-upload")); return; }
        var clear = event.target.closest("[data-clear-image]");
        if (clear) {
          var key = clear.getAttribute("data-clear-image");
          var input = shell.querySelector('[data-shop="' + key + '"]');
          if (input) input.value = "";
          var wrap = shell.querySelector('[data-preview-wrap="' + key + '"]');
          if (wrap) wrap.innerHTML = imageMarkup("");
          return;
        }
        if (event.target.id === "saveShop" || event.target.id === "saveMember") { saveShop(); return; }
        if (event.target.id === "addDish") { dishEditor(null); return; }
        var editDish = event.target.closest("[data-edit-dish]");
        if (editDish) {
          var id = editDish.getAttribute("data-edit-dish");
          dishEditor((data.dishes || []).filter(function (x) { return x.id === id; })[0]);
          return;
        }
        if (event.target.id === "manageCategories") { categoryManager(); return; }
        if (event.target.id === "addCoupon") { couponEditor(null); return; }
        var editCoupon = event.target.closest("[data-edit-coupon]");
        if (editCoupon) {
          var cid = editCoupon.getAttribute("data-edit-coupon");
          couponEditor((data.coupons || []).filter(function (x) { return x.id === cid; })[0]);
          return;
        }
        var order = event.target.closest("[data-order]");
        if (order) {
          var status = order.getAttribute("data-status");
          if (status === "cancelled" && !confirm("确定取消这个订单？")) return;
          order.disabled = true;
          try {
            var result = await request("/dining/admin/order", "POST", {
              id: order.getAttribute("data-order"), status: status
            });
            setData(result); render(); toast("订单状态已更新");
          } catch (e) { order.disabled = false; toast(e.message || "更新失败"); }
        }
      });
      shell.addEventListener("input", function (event) {
        var key = event.target.getAttribute("data-shop") || event.target.getAttribute("data-image-field");
        if (!key) return;
        var wrap = document.querySelector('[data-preview-wrap="' + key + '"]');
        if (wrap) wrap.innerHTML = imageMarkup(event.target.value.trim(), key === "dishImage" ? "thumb" : "");
      });
      modalMask.addEventListener("click", function (event) {
        if (event.target === modalMask) closeModal();
      });

      request("/dining/admin").then(function (result) {
        setData(result);
        render();
      }).catch(function (error) {
        shell.innerHTML = '<div class="loading"><div><div style="font-size:44px;margin-bottom:14px">◈</div>' +
          '<b style="display:block;color:#f0d8a7;font-size:18px;margin-bottom:8px">当前账号不是门店运营</b>' +
          '<span style="display:block;line-height:1.7;max-width:280px">请使用开通了 App 运营权限的账号登录后再进入。<br>' +
          esc(error.message || "") + '</span></div></div>';
      });
    })();
  </script>
</body>
</html>
